[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marge"
version = "0.1.0"
description = "Marge — per-client profitability for MSPs (AWS Quick Suite + Bedrock)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
aws = ["boto3>=1.34"]
assets = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
marge = "marge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
markers = [
    "integration: end to end on generated data (still offline)",
    "slow: kept out of the default PR run",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "data", "infra", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "RUF"]
ignore = ["ARG002", "ARG004", "RUF012", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"data/generator/**" = ["RUF001"]

[tool.coverage.run]
source = ["src/marge"]
omit = ["*/tests/*"]
